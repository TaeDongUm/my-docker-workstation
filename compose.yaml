services:
  web:
    image: nginx:alpine
    container_name: bonus-web
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./templates:/usr/share/nginx/html:ro
    networks:
      - bonus-network

  helper:
    image: nginx:alpine
    container_name: bonus-helper
    volumes:
      - ./helper-templates:/usr/share/nginx/html:ro
    networks:
      - bonus-network

networks:
  bonus-network:
    driver: bridge