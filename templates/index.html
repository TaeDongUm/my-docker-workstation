<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visitor Counter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <p class="badge">Flask + Jinja2 + Docker Demo</p>
    <h1>방문 카운터</h1>
    <p class="label">Current visits</p>
    <div class="counter">{{ count }}</div>
    <p class="description">
      이 숫자는 <code>data/counter.txt</code>에 저장됩니다.
      페이지를 새로고침하면 1씩 증가합니다.
    </p>

    <a class="button" href="{{ url_for('health') }}">Health Check</a>
  </main>
</body>
</html>
